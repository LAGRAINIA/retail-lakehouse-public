# Credentials come from environment variables (.env locally, Airflow connection / secrets in production).
retail:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:
    dev:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST', 'not-set.cloud.databricks.com') | replace('https://', '') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH', '/sql/1.0/warehouses/not-set') }}"
      token: "{{ env_var('DATABRICKS_TOKEN', 'not-set') }}"
      catalog: "{{ env_var('DATABRICKS_CATALOG', 'retail') }}"
      schema: dev            # dev_silver, dev_gold... (see macros/generate_schema_name.sql)
      threads: 4
    prod:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST', 'not-set.cloud.databricks.com') | replace('https://', '') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH', '/sql/1.0/warehouses/not-set') }}"
      token: "{{ env_var('DATABRICKS_TOKEN', 'not-set') }}"
      catalog: "{{ env_var('DATABRICKS_CATALOG', 'retail') }}"
      schema: prod           # silver, gold, quality, snapshots
      threads: 4
